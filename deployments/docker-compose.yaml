name: pai_smart

services:
  mysql:
    container_name: mysql
    image: mysql:8
    restart: always
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: PaiSmart
    volumes:
      - mysql-data:/var/lib/mysql
      - ../docs/ddl.sql:/docker-entrypoint-initdb.d/001-ddl.sql:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --explicit_defaults_for_timestamp=true --lower_case_table_names=1
    healthcheck:
      start_period: 5s
      test:
        - CMD-SHELL
        - 'MYSQL_PWD="$${MYSQL_ROOT_PASSWORD}" mysqladmin ping -h 127.0.0.1 -uroot --silent'
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: redis
    restart: always
    ports:
      - "127.0.0.1:6380:6379"
    environment:
      DATABASE_REDIS_PASSWORD: "${DATABASE_REDIS_PASSWORD:?Set DATABASE_REDIS_PASSWORD}"
    volumes:
      - redis-data:/data
    command:
      - /bin/sh
      - -c
      - 'exec redis-server --bind 0.0.0.0 --port 6379 --requirepass "$${DATABASE_REDIS_PASSWORD}" --appendonly yes'
    healthcheck:
      start_period: 5s
      test:
        - CMD-SHELL
        - 'REDISCLI_AUTH="$${DATABASE_REDIS_PASSWORD}" redis-cli --raw ping | grep -qx PONG'
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: minio
    restart: always
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ACCESS_KEY_ID:?Set MINIO_ACCESS_KEY_ID}"
      MINIO_ROOT_PASSWORD: "${MINIO_SECRET_ACCESS_KEY:?Set MINIO_SECRET_ACCESS_KEY}"
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: minio-init
    depends_on:
      - minio
    environment:
      MINIO_ACCESS_KEY_ID: "${MINIO_ACCESS_KEY_ID:?Set MINIO_ACCESS_KEY_ID}"
      MINIO_SECRET_ACCESS_KEY: "${MINIO_SECRET_ACCESS_KEY:?Set MINIO_SECRET_ACCESS_KEY}"
    entrypoint: >
      sh -c "
      sleep 5;
      mc alias set local http://minio:9000 \"$${MINIO_ACCESS_KEY_ID}\" \"$${MINIO_SECRET_ACCESS_KEY}\" &&
      mc mb -p local/uploads || true
      "
    restart: "no"

  tika:
    image: apache/tika:latest-full
    container_name: tika-server
    ports:
      - "127.0.0.1:9998:9998"
    restart: unless-stopped

  document-worker:
    build:
      context: ..
      dockerfile: deployments/document-worker.Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8091:8091"
    environment:
      WORKER_PORT: "8091"
      TOKENIZER_ID: "${DOCUMENT_TOKENIZER_ID:-Qwen/Qwen3-Embedding-0.6B}"
      EMBEDDING_MODEL: "${DOCUMENT_EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-0.6B}"
      TOKENIZER_REVISION: "${DOCUMENT_TOKENIZER_REVISION:?Set the fixed 40-character tokenizer commit}"
      DOCUMENT_WORKER_TOKEN: "${DOCUMENT_WORKER_TOKEN:?Set a private worker token}"
      TIKA_URL: "http://tika:9998"
      MAX_FILE_BYTES: "33554432"
      PARSE_TIMEOUT_SECONDS: "180"
    volumes:
      - document-models:/models
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=1g
    mem_limit: 6g
    cpus: 2
    pids_limit: 128
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      - tika

  zookeeper:
    image: confluentinc/cp-zookeeper:7.2.1
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.2.1
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

  kafka-init:
    image: confluentinc/cp-kafka:7.2.1
    container_name: kafka-init
    depends_on:
      - kafka
    entrypoint: >
      sh -c "
      sleep 10;
      kafka-topics --create --if-not-exists --topic file-processing --bootstrap-server kafka:29092 || true;
      "
    restart: "no"

  es:
    image: elasticsearch:8.10.4
    container_name: es
    restart: always
    ports:
      - "127.0.0.1:9200:9200"
    environment:
      - node.name=pai-smart-es01
      - discovery.type=single-node
      - xpack.license.self_generated.type=basic
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - xpack.security.http.ssl.enabled=false
      - cluster.name=pai-smart-es-cluster
      - ES_JAVA_OPTS=-Xms2g -Xmx2g
    volumes:
      - es-data:/usr/share/elasticsearch/data
    deploy:
      resources:
        limits:
          memory: 2g
    command: >
      bash -c "
      if ! elasticsearch-plugin list | grep -q 'analysis-ik'; then
        echo 'Installing analysis-ik plugin...';
        elasticsearch-plugin install --batch https://release.infinilabs.com/analysis-ik/stable/elasticsearch-analysis-ik-8.10.4.zip;
      else
        echo 'analysis-ik plugin already installed.';
      fi;
      /usr/local/bin/docker-entrypoint.sh
      "
    healthcheck:
      test: ["CMD", "curl", "-s", "http://localhost:9200/_cluster/health?pretty"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  mysql-data:
  redis-data:
  minio-data:
  kafka-data:
  es-data:
  document-models:

networks:
  default:
    name: paismart-go-network
